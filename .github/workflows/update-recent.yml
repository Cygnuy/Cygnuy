name: Update Recent Activity

on:
  schedule:
    - cron: '0 0 * * *'   # 每天 UTC 0 点运行
  workflow_dispatch:      # 支持手动触发

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate and Update README
        run: |
          python -c "
import json
import urllib.request
import re

# 获取公开仓库数据（按最近推送排序）
url = 'https://api.github.com/users/Cygnuy/repos?sort=pushed&direction=desc&per_page=6'
with urllib.request.urlopen(url) as response:
    repos = json.loads(response.read())

# 生成 Markdown 列表
items = []
for r in repos:
    name = r['name']
    url = r['html_url']
    desc = r['description'] or 'No description'
    items.append(f'- [{name}]({url}) – {desc}')

# 将列表插入到标记之间
with open('README.md', 'r') as f:
    content = f.read()

new_content = re.sub(
    r'(<!-- RECENT_ACTIVITY:START -->)(.*?)(<!-- RECENT_ACTIVITY:END -->)',
    r'\1\n' + '\n'.join(items) + '\n\3',
    content,
    flags=re.DOTALL
)

with open('README.md', 'w') as f:
    f.write(new_content)
print('README updated successfully!')
          "

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: update recent activity"
          git push
