name: Update Recent Activity

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

# 修复1：赋予写入权限，解决 exit code 128
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # 修复2：升级到 Node.js 24 兼容版本
      - uses: actions/checkout@v5

      - name: Setup Python
        # 修复2：升级到 Node.js 24 兼容版本
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Generate and Update README
        run: |
          cat > update.py <<'EOF'
          import json
          import urllib.request
          import re

          url = 'https://api.github.com/users/Cygnuy/repos?sort=pushed&direction=desc&per_page=6'
          with urllib.request.urlopen(url) as response:
              repos = json.loads(response.read())

          items = []
          for r in repos:
              name = r['name']
              url = r['html_url']
              desc = r['description'] or 'No description'
              items.append(f'- [{name}]({url}) – {desc}')

          with open('README.md', 'r') as f:
              content = f.read()

          new_content = re.sub(
              r'(<!-- RECENT_ACTIVITY:START -->)(.*?)(<!-- RECENT_ACTIVITY:END -->)',
              r'\1\n' + '\n'.join(items) + '\n\3',
              content,
              flags=re.DOTALL
          )

          with open('README.md', 'w') as f:
              f.write(new_content)
          print('README updated successfully!')
          EOF
          python update.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: update recent activity"
          git push
